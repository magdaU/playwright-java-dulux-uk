<!DOCTYPE html>
<html lang="en">
<head><title>Stub search results</title></head>
<body>
<main>
  <h1 id="heading"></h1>
  <p id="message"></p>
</main>
<script>
  // textContent (not innerHTML) keeps hostile search terms inert.
  var term = new URLSearchParams(location.search).get('search');
  document.getElementById('heading').textContent = "search for '" + term + "'";
  document.getElementById('message').textContent = "Sorry, we couldn't find any results for '" + term + "'";
</script>
</body>
</html>
